services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: rates }
    volumes: ["./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  redis:
    image: redis:7-alpine
  api:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/rates
      REDIS_URL: redis://redis:6379
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
  worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/rates
      REDIS_URL: redis://redis:6379
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_started } }
